<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>همسة - مجموعات السوشيال</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1f4e9c;--bd:#163a75;--bx:#0d2a57;--g:#f5c518;--g2:#ffdd55;--bg:#f2f5fb;--t:#1b2433;--m:#6b7587;--ok:#1e8e4e;--er:#c0392b;--sh:0 8px 28px rgba(22,58,117,.10);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 90% -10%,#1f4e9c18,transparent),radial-gradient(700px 400px at -10% 100%,#f5c51824,transparent)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orb{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.18)}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes sweep{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
/* ===== login ===== */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden;background:linear-gradient(135deg,var(--bx),var(--bd) 45%,var(--b));transition:opacity .5s,transform .5s}
#login.out{opacity:0;transform:scale(1.05);pointer-events:none}
#login .orb{position:absolute;border-radius:50%;filter:blur(60px);animation:orb 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:var(--g);top:-120px;left:-100px;opacity:.3}
.o2{width:460px;height:460px;background:#3b82f6;bottom:-160px;right:-120px;opacity:.5;animation-delay:-5s!important}
.o3{width:220px;height:220px;background:var(--g);bottom:12%;left:14%;opacity:.18;animation-delay:-9s!important}
#login .pat{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(#fff 1.3px,transparent 1.3px);background-size:30px 30px}
#login .ring{position:absolute;border:2px dashed #f5c51855;border-radius:50%;animation:spin 60s linear infinite}
.r1{width:620px;height:620px;top:50%;left:50%;margin:-310px 0 0 -310px}
.r2{width:860px;height:860px;top:50%;left:50%;margin:-430px 0 0 -430px;animation-direction:reverse!important;animation-duration:90s!important;border-color:#ffffff22!important}
.lcard{position:relative;width:100%;max-width:410px;background:#fffffff2;border-radius:28px;padding:30px 30px 24px;text-align:center;box-shadow:0 30px 80px #0007;border-top:6px solid var(--g);animation:pop .8s var(--ease) backwards}
.lcard.shake{animation:shake .5s}
.brandmark{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(135deg,#fff7cf,#f5c518);font-size:40px;box-shadow:0 12px 30px #f5c51835;animation:float 5s ease-in-out infinite}
.lcard h2{margin:6px 0 4px;color:var(--bd);font-size:24px;font-weight:800}
.lcard .sub{margin:0 0 18px;color:var(--m);font-size:14px}
.lcard>*{animation:up .7s var(--ease) backwards}
.lcard>*:nth-child(2){animation-delay:.15s}.lcard>*:nth-child(3){animation-delay:.25s}.lcard>*:nth-child(4){animation-delay:.35s}.lcard>*:nth-child(5){animation-delay:.45s}
.fld{position:relative;margin:12px 0}
.fld input{width:100%;padding:14px 46px;border-radius:14px;border:2px solid #e1e7f3;background:#f7f9fd;font-size:16px;transition:.25s;text-align:center;letter-spacing:2px}
.fld input:focus{outline:0;border-color:var(--b);background:#fff;box-shadow:0 0 0 5px #1f4e9c1f}
.fld .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.fld .eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer;padding:8px;opacity:.6;transition:.2s}.fld .eye:hover{opacity:1}
.lbtn{position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:17px;font-weight:800;color:var(--bd);cursor:pointer;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 8px 20px #f5c5185a;transition:.25s}
.lbtn::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sweep 3.2s ease-in-out infinite}
.lbtn:hover{transform:translateY(-2px);box-shadow:0 12px 26px #f5c51878}.lbtn:active{transform:scale(.98)}
.lbtn:disabled{cursor:wait}.lbtn.loading span{opacity:0}
.lbtn.loading::before{content:"";position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px;border:3px solid #163a7544;border-top-color:var(--bd);border-radius:50%;animation:spin .7s linear infinite;z-index:1}
#lerr{color:var(--er);min-height:22px;margin:12px 0 0;font-size:14px;font-weight:600}
.lcard .foot{margin-top:6px;color:#9aa5b8;font-size:12px}
/* ===== header / nav ===== */
#app{animation:fade .6s}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;color:#fff;background:linear-gradient(120deg,var(--bx),var(--bd) 50%,var(--b));box-shadow:0 6px 24px #163a7544}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--g),var(--g2),#fff3b0,var(--g2),var(--g));background-size:200% 100%;animation:shine 5s linear infinite}
header .brandmark{width:42px;height:42px;margin:0;border-radius:13px;font-size:25px;animation:none;box-shadow:none;flex:none}
header h1{font-size:18px;margin:0;flex:1;line-height:1.25;font-weight:800;min-width:150px}header h1 small{display:block;font-size:12px;font-weight:400;color:#ffe9a0}
#who{background:#ffffff22;border:1px solid #ffffff33;padding:5px 14px;border-radius:30px;font-size:13px}#who:empty{display:none}
nav{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;background:#ffffffd9;backdrop-filter:blur(10px);border-bottom:1px solid #e3e8f2}
nav button{border:0;border-radius:30px;padding:9px 18px;background:transparent;color:var(--m);cursor:pointer;font:inherit;font-weight:600;white-space:nowrap;transition:.25s}
nav button:hover{background:#eaf0fb;color:var(--bd)}
nav button.on{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff;box-shadow:0 6px 16px #1f4e9c55}
main{max-width:1100px;margin:auto;padding:18px}
/* ===== buttons / fields ===== */
.btn{border:0;border-radius:12px;padding:9px 16px;background:#eaf0fb;color:var(--bd);cursor:pointer;font:inherit;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block;transition:.25s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #163a751f}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.p{background:linear-gradient(135deg,var(--b),var(--bd));color:#fff}.btn.g{background:linear-gradient(135deg,var(--g),var(--g2));color:#2b2300}.btn.d{background:#fdecea;color:var(--er)}.btn.s{padding:6px 12px;font-size:13px}
input,select,textarea{padding:10px 12px;border:2px solid #e1e7f3;border-radius:12px;font:inherit;background:#fff;max-width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 4px #1f4e9c1a}
textarea{width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.bar input{flex:1;min-width:180px}
/* ===== cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:#fff;border-radius:18px;padding:16px;border:1px solid #edf0f7;box-shadow:var(--sh);transition:transform .3s var(--ease),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(22,58,117,.16)}
.card.click{cursor:pointer;border-top:4px solid var(--g)}.card.click b{font-size:16px;color:var(--bd)}
#view>*,.grid>*{animation:up .55s var(--ease) backwards}
.grid>:nth-child(2){animation-delay:.04s}.grid>:nth-child(3){animation-delay:.08s}.grid>:nth-child(4){animation-delay:.12s}.grid>:nth-child(5){animation-delay:.16s}.grid>:nth-child(6){animation-delay:.2s}.grid>:nth-child(7){animation-delay:.24s}.grid>:nth-child(8){animation-delay:.28s}.grid>:nth-child(9){animation-delay:.32s}.grid>:nth-child(10){animation-delay:.36s}.grid>:nth-child(n+11){animation-delay:.4s}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:22px 24px;border-radius:22px;color:#fff;background:linear-gradient(120deg,var(--bd),var(--b));position:relative;overflow:hidden;box-shadow:0 14px 34px #1f4e9c40}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff14;top:-100px;left:-60px;animation:orb 9s ease-in-out infinite alternate}
.hero h2{margin:0 0 4px;font-size:22px;font-weight:800;position:relative}.hero p{margin:0;color:#dbe6fa;font-size:14px;position:relative}
.hero .hi{font-size:46px;animation:float 4s ease-in-out infinite;position:relative}
.stat{display:flex;align-items:center;gap:12px}
.stat .ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#eaf0fb,#d9e5fa)}
.stat.gold .ico{background:linear-gradient(135deg,#fff3c4,#ffe27a)}.stat.red .ico{background:#fdecea}.stat.green .ico{background:#e3f6ea}
.num{font-size:28px;font-weight:800;color:var(--b);line-height:1.1}.mut{color:var(--m);font-size:13px}
main h3{margin:24px 0 10px;display:flex;align-items:center;gap:8px;color:var(--bd);font-size:18px}
main h3::before{content:"";width:5px;height:20px;border-radius:4px;background:var(--g)}
.gc{position:relative;overflow:hidden;padding-top:20px}
.gc::before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:var(--pc,var(--b))}
.gc[data-p=facebook]{--pc:#1877f2}.gc[data-p=whatsapp]{--pc:#25d366}.gc[data-p=telegram]{--pc:#229ed9}.gc[data-p=instagram]{--pc:#d6249f}.gc[data-p=tiktok]{--pc:#111}.gc[data-p=youtube]{--pc:#e62117}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#eaf0fb;color:var(--bd);transition:.2s}
.tag.ok{background:#e3f6ea;color:var(--ok)}.tag.bad{background:#fdecea;color:var(--er)}.tag.w{background:#fff6d6;color:#8a6d00}
.card.click .tag{margin:2px 0;cursor:pointer}.card.click .tag:hover{background:var(--b);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.crumb{color:var(--m);margin-bottom:10px;font-size:14px}.crumb a{color:var(--b);cursor:pointer;font-weight:700}.crumb a:hover{text-decoration:underline}
.spin{text-align:center;padding:36px;color:var(--m)}
.spin::before{content:"";display:block;width:36px;height:36px;margin:0 auto 12px;border:4px solid #dbe5f7;border-top-color:var(--b);border-radius:50%;animation:spin .8s linear infinite}
/* ===== modal / toast ===== */
.modal{position:fixed;inset:0;background:#0b1f4399;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:60;animation:fade .25s}
.box{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-top:6px solid var(--g);box-shadow:0 30px 80px #0006;animation:pop .45s var(--ease)}
.box h3{margin-top:0}.box h3::before{display:none}
.box label{display:block;margin:12px 0 5px;font-size:14px;font-weight:600;color:var(--bd)}.box input,.box select{width:100%}
#toast{position:fixed;bottom:22px;left:50%;padding:12px 22px;border-radius:14px;color:#fff;z-index:70;font-weight:600;box-shadow:0 12px 30px #0004;opacity:0;pointer-events:none;transform:translate(-50%,24px) scale(.95);transition:.4s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* ===== chat / log ===== */
.msg{margin:10px 0;padding:11px 14px;border-radius:16px;background:#f3f5fa;max-width:92%}.msg.u{background:#eaf0fb;margin-right:0;margin-left:auto;border-bottom-left-radius:4px}.msg.a{border-bottom-right-radius:4px}
.msg.e{background:#fdecea}.msg.t{color:var(--m)}.msg.t div{animation:blink 1.2s infinite}.msg:last-child{animation:up .4s var(--ease)}
.msg a{color:var(--b)}
table{border-collapse:collapse}td{border-bottom:1px solid #eef1f8}tr:hover td{background:#f7f9fd}
.hide{display:none!important}
@media(max-width:600px){header h1{font-size:15px}.hero h2{font-size:18px}.hero .hi{font-size:36px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="login">
  <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="pat"></div><i class="ring r1"></i><i class="ring r2"></i>
  <div class="lcard">
    <div class="brandmark" aria-label="همسة للسياحة">🪬</div>
    <h2>دخول الموظفين</h2>
    <p class="sub">اكتب اسم المستخدم وكلمة المرور</p>
    <div class="fld"><span class="ic">👤</span><input id="username" placeholder="اسم المستخدم" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fld"><span class="ic">🔒</span><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" class="eye" onclick="eye()" aria-label="إظهار كلمة المرور">👁</button></div>
    <button class="lbtn" id="lbtn" onclick="doLogin()"><span>دخول</span></button>
    <p id="lerr"></p>
    <div class="foot">همسة للسياحة · نظام مجموعات السوشيال</div>
  </div>
</div>

<div id="app" class="hide">
<header><div class="brandmark" aria-hidden="true">🪬</div><h1>مجموعات السوشيال<small>همسة للسياحة</small></h1><span id="who"></span><button class="btn g s" onclick="openForm()">+ إضافة مجموعة</button><button class="btn s admin-only hide" onclick="openBulk()">+ إضافة جماعية</button><button class="btn s" onclick="logout()">خروج</button></header>
<nav id="nav"></nav>
<main id="view"></main>
</div>
<div id="toast"></div>

<script>
// ====== غيّر السطر ده بعد ما تعمل Deploy للـ Apps Script ======
const API = 'https://script.google.com/macros/s/AKfycbyoiOOAciOOrNxY4IHc8J6HVhXvYDmjj76IWaVCsL0Q0KbTihyTp3tXTbB9s0pI1s9j/exec';
// ===============================================================
const PL = {facebook:'فيسبوك',whatsapp:'واتساب',telegram:'تيليجرام',instagram:'إنستجرام',tiktok:'تيك توك',youtube:'يوتيوب',other:'أخرى'};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {username:'', password:'', token:sessionStorage.getItem('ht')||'', user:null, govs:[], areas:[], cats:[], stats:{}, f:{page:1,sort:'newest'}};

function toast(m, ok=true){const t=$('#toast');t.textContent=m;t.style.background=ok?'linear-gradient(135deg,#1e8e4e,#27ae60)':'linear-gradient(135deg,#c0392b,#e74c3c)';t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),3500);}
async function api(action, extra={}){
  try{
    const payload={action,token:S.token,username:S.username,password:S.password,...extra};
    let j;
    if(window.google&&google.script&&google.script.run){j=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiCall(payload));}
    else {const r=await fetch(API||location.href,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});j=await r.json();}
    if(j.auth===false&&S.user){logout();} return j;
  }catch(e){return {ok:false,error:'تعذر الاتصال بالسيرفر. تأكد من النت وحاول تاني.'};}
}
async function doLogin(){
  const b=$('#lbtn'); S.username=$('#username').value.trim(); S.password=$('#password').value; $('#lerr').textContent='';
  if(!S.username||!S.password) return bad('اكتب اسم المستخدم وكلمة المرور');
  b.classList.add('loading'); b.disabled=true;
  const login=await api('login');if(!login.ok){b.classList.remove('loading');b.disabled=false;return bad(login.error);}
  S.token=login.sessionToken;S.password='';sessionStorage.setItem('ht',S.token);
  const r=await api('bootstrap');b.classList.remove('loading');b.disabled=false;
  if(!r.ok)return bad(r.error);init(r);
}
function bad(m){$('#lerr').textContent=m;const c=$('.lcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
function eye(){const i=$('#password');i.type=i.type==='password'?'text':'password';}
function countUp(){document.querySelectorAll('.num[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0)/900,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3))).toLocaleString('en-US');if(p<1)requestAnimationFrame(f);})(t0);});}
function logout(){sessionStorage.removeItem('ht');S.token='';location.reload();}
function init(r){
  Object.assign(S,{user:r.user,govs:r.govs,areas:r.areas,cats:r.cats,stats:r.stats});
  $('#login').classList.add('out');setTimeout(()=>$('#login').classList.add('hide'),520);$('#app').classList.remove('hide');$('#who').textContent=r.user.name;
  document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hide',r.user.role!=='admin'));
  const tabs=[['dash','🏠 الرئيسية'],['govs','🗺️ المحافظات'],['groups','👥 كل المجموعات']];
  if(r.user.role==='admin')tabs.push(['team','📊 متابعة الموظفين'],['employees','👤 إدارة الموظفين'],['log','📋 سجل النشاط']); else tabs.unshift(['tasks','✅ مهامي اليومية']);
  $('#nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  if(r.user.role!=='admin'&&!window.employeeRefresh)window.employeeRefresh=setInterval(()=>{if($('#nav .on')?.dataset.t==='tasks'&&!document.activeElement.matches('input,textarea,select'))tasksPage(true);},60000);
  go(r.user.role==='admin'?'dash':'tasks');
}
function go(t,opt){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='dash')dash(); if(t==='tasks'&&S.user.role!=='admin')tasksPage(); if(t==='team'&&S.user.role==='admin')teamPage(); if(t==='employees'&&S.user.role==='admin')employeesPage(); if(t==='govs')govsPage(); if(t==='groups'){if(opt)S.f=Object.assign({page:1,sort:'newest'},opt);groupsPage();} if(t==='log')logPage();
}
const gname = id => (S.govs.find(g=>g.id===id)||{}).name_ar||'';
const aname = id => (S.areas.find(a=>a.id===id)||{}).name_ar||'';

function dash(){
  const s=S.stats, p=s.byPlatform||{};
  const c=(n,l,i='📊',k='')=>`<div class="card stat ${k}"><div class="ico">${i}</div><div><div class="num" data-n="${n||0}">0</div><div class="mut">${l}</div></div></div>`;
  $('#view').innerHTML=`<div class="hero"><div><h2>أهلاً ${esc(S.user.name)} 👋</h2><p>ملخص سريع لمجموعات همسة للسياحة على السوشيال ميديا</p></div><span class="hi">🕌</span></div>
  <div class="bar"><input id="q" placeholder="بحث سريع (اسم، رابط، منطقة...)" onkeydown="if(event.key==='Enter')go('groups',{q:this.value,page:1,sort:'newest'})"><button class="btn p" onclick="go('groups',{q:$('#q').value,page:1,sort:'newest'})">بحث</button></div>
  <div class="grid">${c(s.total,'إجمالي المجموعات','👥','gold')}${c(s.govs,'محافظات','🗺️')}${c(s.areas,'مناطق مسجلة','📍')}${c(s.today,'أضيف اليوم','✨','green')}
  ${c(p.facebook,'فيسبوك','📘')}${c(p.whatsapp,'واتساب','💬','green')}${c(p.telegram,'تيليجرام','✈️')}${c(p.instagram,'إنستجرام','📸','gold')}${c(s.pending,'في انتظار التوثيق','⏳','gold')}${c(s.broken,'روابط معطلة','⚠️','red')}</div>

function parseBulk(text){
  const out=[];
  String(text||'').split(/\n+/).forEach(line=>{
    const m=line.match(/https?:\/\/[^\s|,،؛]+/i); if(!m)return;
    const url=m[0].replace(/[)\]>.,]+$/,'');
    const name=line.replace(m[0],'').trim().replace(/^[|\t,،؛\-–—:\s]+|[|\t,،؛\-–—:\s]+$/g,'');
    out.push({name,url});
  });
  return out;
}

async function teamPage(){
  $('#view').innerHTML='<div class="spin">جاري تحميل متابعة اليوم...</div>';const [r,er]=await Promise.all([api('getTeamTasks'),api('listEmployees')]);if(!r.ok||!er.ok){$('#view').textContent=(r.error||er.error);return;}
  const types={call:'📞 مكالمة',post:'📣 نشر على صفحة',find_page:'🔎 البحث عن صفحة'}, labels={pending:'لم تبدأ',in_progress:'جاري التنفيذ',done:'تمت',blocked:'متعذرة'};
  const by={};er.items.filter(e=>e.role!=='admin'&&e.active).forEach(e=>by[e.name]=[]);r.items.forEach(t=>(by[t.employee]||(by[t.employee]=[])).push(t));
  S.employees=er.items.filter(e=>e.role!=='admin');
  $('#view').innerHTML=`<div class="hero"><div><h2>متابعة الموظفين</h2><p>هنا المدير يشوف إنجاز كل موظف ومهامه، من غير ما يعدّل مهام الموظف.</p></div><span class="hi">📊</span></div>
  <div class="card"><b>إضافة مهام للمخزون</b><p class="mut">مهمة واحدة في كل سطر بالشكل: النوع | العنوان | رقم أو رابط | تعليمات. الأنواع: call أو post أو find_page.</p><textarea id="ptbulk" rows="5" dir="auto" placeholder="call | اتصال بعميل | 01000000000 | اتصل بعد الظهر&#10;post | صفحة سياحة | https://facebook.com/... | انشر العرض"></textarea><button class="btn p" onclick="bulkTasks()">إضافة المهام للمخزون</button></div>
  <div class="card"><b>تقرير المهام</b><div class="bar"><label>من <input id="rf" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>إلى <input id="rt" type="date" value="${new Date().toISOString().slice(0,10)}"></label><select id="re"><option value="">كل الموظفين</option>${S.employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select><select id="rty"><option value="">كل أنواع المهام</option><option value="call">مكالمات</option><option value="post">نشر</option><option value="find_page">بحث صفحات</option></select><button class="btn p" onclick="loadTaskReport()">عرض التقرير</button></div><div id="reportout" class="mut">اختار المدة واضغط عرض التقرير.</div></div>
  <h3>مهام اليوم</h3><div class="grid">${Object.entries(by).map(([name,tasks])=>{const done=tasks.filter(t=>t.status==='done').length;return `<div class="card team-employee" data-employee="${esc(name)}"><h3>${esc(name)}</h3><div class="mut team-total">أنجز ${done} من ${tasks.length}</div><div class="team-breakdown">${Object.keys(types).map(k=>`${types[k]}: ${tasks.filter(t=>t.type===k&&t.status==='done').length}/${tasks.filter(t=>t.type===k).length}`).join(' · ')}</div><details><summary>عرض المهام والنتائج</summary><div style="max-height:350px;overflow:auto">${tasks.map(t=>`<div class="msg ${t.status==='done'?'t':''}"><b>${types[t.type]||esc(t.type)} · ${esc(t.title)}</b> — ${labels[t.status]||esc(t.status)}<br><span class="mut">${esc(t.result||'لا توجد نتيجة مسجلة')}</span></div>`).join('')}</div></details></div>`}).join('')||'<div class="card mut">لا توجد مهام موزعة اليوم.</div>'}</div>`;
  if(window.teamRefresh)clearInterval(window.teamRefresh);window.teamRefresh=setInterval(()=>{if($('#nav .on')?.dataset.t==='team'&&!document.activeElement.matches('input,textarea,select'))refreshTeamStatus();},60000);
}
async function refreshTeamStatus(){const r=await api('getTeamTasks');if(!r.ok)return;document.querySelectorAll('.team-employee').forEach(card=>{const tasks=r.items.filter(t=>t.employee===card.dataset.employee),done=tasks.filter(t=>t.status==='done').length;card.querySelector('.team-total').textContent=`أنجز ${done} من ${tasks.length}`;card.querySelector('.team-breakdown').textContent=['call','post','find_page'].map(k=>`${k==='call'?'مكالمات':k==='post'?'نشر':'بحث'}: ${tasks.filter(t=>t.type===k&&t.status==='done').length}/${tasks.filter(t=>t.type===k).length}`).join(' · ');});}
async function bulkTasks(){const lines=$('#ptbulk').value.split(/\n+/).filter(x=>x.trim()),names={مكالمة:'call',اتصال:'call',نشر:'post',بحث:'find_page'},rows=[];lines.forEach(line=>{const p=line.split('|').map(x=>x.trim());rows.push({type:names[p[0]]||p[0],title:p[1],target:p[2],details:p[3]||''});});if(!rows.length)return toast('اكتب المهام الأول',false);let added=0,bad=0;for(let i=0;i<rows.length;i+=5000){const r=await api('bulkAddTasks',{rows:rows.slice(i,i+5000)});if(!r.ok)return toast(r.error,false);added+=r.added;bad+=r.bad;}toast(`اتضاف ${added} مهمة، ورفض ${bad} سطر`);$('#ptbulk').value='';}
async function loadTaskReport(){const r=await api('getTaskReport',{from:$('#rf').value,to:$('#rt').value,employee_id:$('#re').value,type:$('#rty').value});if(!r.ok)return toast(r.error,false);$('#reportout').innerHTML=`إجمالي ${r.summary.total} · مكتمل ${r.summary.done} (${r.summary.percent}%)<div style="max-height:400px;overflow:auto"><table width="100%" cellpadding="6">${r.items.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.employee)}</td><td>${esc(t.type)}</td><td>${esc(t.title)}</td><td>${esc(t.status==='done'?'تم':'لم يتم')}</td><td>${esc(t.result||'')}</td><td>${t.status==='done'?`<button class="btn s" onclick="returnTask('${t.id}')">إعادة للمخزون</button>`:''}</td></tr>`).join('')}</table></div>`;}
async function returnTask(id){if(!confirm('ترجع المهمة لمخزون التوزيع اليومي القادم؟'))return;const r=await api('returnTaskToPool',{id});if(!r.ok)return toast(r.error,false);toast('رجعت للمخزون، وهتكون متاحة في التوزيع القادم');loadTaskReport();}
async function exportCsv(){
  const r=await api('groups',Object.assign({},S.f,{page:1,all:true})); if(!r.ok)return toast(r.error,false);
  const cols=['id','name','platform','url','gov_id','area_id','status','verification','category','added_by','created_at'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[cols.join(',')].concat(r.items.map(g=>cols.map(c=>q(g[c])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='groups.csv';a.click();
}
async function logPage(){
  $('#view').innerHTML='<div class="spin">جاري التحميل...</div>';const r=await api('activity');
  if(!r.ok){$('#view').innerHTML=esc(r.error);return;}
  $('#view').innerHTML=`<div class="card" style="overflow:auto"><table width="100%" cellpadding="6">${r.items.map(i=>`<tr><td class="mut">${esc(i.time)}</td><td>${esc(i.employee)}</td><td>${esc(i.action)}</td><td>${esc(i.target)}</td></tr>`).join('')}</table></div>`;
}
if(S.token){api('bootstrap').then(r=>r.ok?init(r):logout());}
</script>
</body>
</html>
